<script type="text/javascript">
    RED.nodes.registerType('hailo-libero-device', {
        category: 'config',
        defaults: {
            host: { value: "", required: true },
            port: { value: 81, required: true },
            protocol: { value: "http", required: true },
            debug: { value: false }
        },
        credentials: {
            pin: { type: "password" }
        },
        label: function () {
            return this.host || "Hailo Libero";
        }
    });
</script>

<script type="text/html" data-template-name="hailo-libero-device">
    <div class="form-row">
        <label for="node-config-input-host">Host</label>
        <input id="node-config-input-host" type="text" placeholder="192.168.0.200">
    </div>

    <div class="form-row">
        <label for="node-config-input-port">Port</label>
        <input id="node-config-input-port" type="number" placeholder="81" min="1" max="65535">
    </div>

    <div class="form-row">
        <label for="node-config-input-protocol">Protocol</label>
        <select id="node-config-input-protocol">
            <option value="http">http</option>
            <option value="https">https</option>
        </select>
    </div>

    <div class="form-row">
        <label for="node-config-input-pin">PIN</label>
        <input id="node-config-input-pin" type="password" >
    </div>

    <div class="form-row">
        <label for="node-config-input-debug">Enable debug</label>
        <input id="node-config-input-debug" type="checkbox">
    </div>
</script>
